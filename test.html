<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>madenlbrut</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  #wrap { display: flex; width: 100vw; height: 100vh; }
  .pane { position: relative; width: 50%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
  .info {
    position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace;
    font-size: 12px; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px;
    pointer-events: none; white-space: nowrap;
  }
  #divider { width: 2px; background: #444; }

  #mandelPane { width: 100%; }
  #juliaPane { display: none; }
  #divider { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="pane" id="mandelPane">
    <canvas id="mandel"></canvas>
    <div class="info" id="mandelInfo">Mandelbrot</div>
  </div>
  <div id="divider"></div>
  <div class="pane" id="juliaPane">
    <canvas id="julia"></canvas>
    <div class="info" id="juliaInfo">Julia set</div>
  </div>
</div>
<script src="mandelbrot.js"></script>
</body>
</html>
